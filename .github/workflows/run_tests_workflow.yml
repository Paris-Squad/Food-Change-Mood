name: Check Testes
on:
  pull_request:
    branches: [ "dev" ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Give gradlew permission to execute
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test